name = "Main"
version = "0.1.0"
defaultTargets = ["Main"]
buildDir = ".lake/build-DLMF"

[leanOptions]
# Mathlib convention: undeclared names in statements are errors, not auto-bound implicits.
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Main"
roots = ["DLMF", "DLMFMathlib"]
globs = ["DLMF", "DLMF.+", "DLMFMathlib", "DLMFMathlib.+"]

[[lean_exe]]
name = "main"
root = "Main"

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Shared upgrade snapshot, 2026-10-18: Lean v4.36.0-rc1.
rev = "911003dd6dea5df215dff57f2717be762e11a6ca"

[[require]]
name = "doc-gen4"
scope = "leanprover"
rev = "v4.36.0-rc1"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "a049b4264d2cf4dbf4720796f844a3a3764914a5"

[[require]]
# Sibling project lean-codes (Carlson R-functions and elliptic integrals), user-approved 2026-10-25.
name = "LeanCodes"
path = "../lean-codes"
