name = "Main"
version = "0.1.0"
defaultTargets = ["Main"]
buildDir = ".lake/build-DLMF"

[leanOptions]
# Mathlib convention: undeclared names in statements are errors, not auto-bound implicits.
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Main"
roots = ["DLMF", "DLMFMathlib"]
globs = ["DLMF", "DLMF.+", "DLMFMathlib", "DLMFMathlib.+"]

[[lean_exe]]
name = "main"
root = "Main"

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Shared upgrade snapshot, 2026-11-12: Lean v4.36.0-rc2 (TauCeti main 396c3bd971 and its Mathlib).
rev = "1b1ccf4b088b32fa3f23f2de1127433254a81e1e"

[[require]]
name = "doc-gen4"
scope = "leanprover"
rev = "v4.36.0-rc2"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "396c3bd971e9722aa8656231760e710fe641d8cf"

[[require]]
# Sibling project lean-codes (Carlson R-functions and elliptic integrals), user-approved 2026-10-25.
name = "LeanCodes"
path = "../lean-codes"
